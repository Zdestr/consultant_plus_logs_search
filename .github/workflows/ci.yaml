name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run tests
      run: mvn test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build fat JAR
      run: mvn package -DskipTests

    - name: Set image tag
      id: meta
      run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/cp-pipeline
        TAG=${{ steps.meta.outputs.tag }}
        docker build -t $IMAGE:$TAG -t $IMAGE:latest .
        docker push $IMAGE:$TAG
        docker push $IMAGE:latest

    - name: Update staging overlay
      run: |
        cd k8s/overlays/staging
        kustomize edit set image \
          ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/cp-pipeline:${{ steps.meta.outputs.tag }}
        git config user.email "ci@internal"
        git config user.name "CI"
        git commit -am "ci: update cp-pipeline to ${{ steps.meta.outputs.tag }}"
        git push
