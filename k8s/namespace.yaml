apiVersion: v1
kind: Namespace
metadata:
  name: consultant-plus
---
apiVersion: v1
kind: LimitRange
metadata:
  name: consultant-plus-defaults
  namespace: consultant-plus
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "4000m"
      memory: "8Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: consultant-plus-quota
  namespace: consultant-plus
spec:
  hard:
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "32"
    limits.memory: "64Gi"
    pods: "30"
